[workspace]
resolver = "3"
members = ["orangedb", "orangedb-cli", "orangedb-macros"]
exclude = ["bench"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andunieee/orangedb"

[workspace.dependencies]
orangedb = { path = "orangedb", version = "0.3.0" }
orangedb-macros = { path = "orangedb-macros", version = "0.3.0" }
