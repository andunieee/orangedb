[package]
name = "orangedb-cli"
description = "Inspect orangedb files: schema sources, tables, references, indexes and rows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[[bin]]
name = "orangedb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
orangedb = { path = "../orangedb", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
